spring.application.name=TechStoreApplication
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Johannesburg
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true




spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Security
app.jwt.secret=VGhpc0lzQVNlY3VyZVRlY2hTdG9yZUpXVFNlY3JldEtleUZvckFEQ1AzNzJTMjAyNg==
app.jwt.expiration-ms=86400000

app.seed.enabled=true
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173


# Email (dev: run Mailpit; SMTP on 1025, inbox at http://localhost:8025).
# If the SMTP server is unreachable, codes are written to the backend log instead.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
app.mail.from=no-reply@techvault.local
# Demo only: true returns verification/reset codes in the API response. Keep false normally.
app.auth.expose-codes=false
# false = new customers are active immediately and logged in; true = must enter an emailed code first
app.auth.require-email-verification=false
